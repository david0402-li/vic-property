name: Diagnose downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/diag.py", ".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests curl_cffi pandas
      - run: python scripts/diag.py
      - name: commit
        if: always()
        run: |
          git config user.name "vic-property-bot"; git config user.email "actions@users.noreply.github.com"
          git add debug; git commit -m "diag" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
