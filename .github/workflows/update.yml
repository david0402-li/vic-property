name: Daily data update

on:
  schedule:
    - cron: "17 18 * * *"   # 18:17 UTC = ~5am Sydney, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/pipeline.py

      - name: Commit data + debug output
        if: always()
        run: |
          git config user.name "vic-property-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A debug site/data || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: update $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Deploy site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
